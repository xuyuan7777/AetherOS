name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 诊断项目结构
        run: |
          echo "===== package.json ====="
          cat package.json || true
          echo "===== 根目录文件 ====="
          ls -la
          echo "===== capacitor 配置 ====="
          cat capacitor.config.* 2>/dev/null || echo "没有 capacitor.config"
          echo "===== android 目录 ====="
          ls android 2>/dev/null || echo "没有 android 目录"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装依赖
        run: npm install

      - name: 构建前端
        run: npm run build

      - name: 确保 Android 平台存在
        run: |
          if [ ! -d "android" ]; then
            npm install -D @capacitor/cli @capacitor/core @capacitor/android
            npx cap add android
          fi

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 授权 gradlew
        run: chmod +x android/gradlew

      - name: 编译 Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: 查找 APK（诊断）
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null || echo "没找到 apk"

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AetherOS-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
